# ===========================================
# Hi Cleo — Docker Compose (Desenvolvimento Local)
# ===========================================
# Uso: docker compose up --build
# Todos os serviços sobem com um único comando.

services:
  # --- Aplicação ---

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hicleo-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - DATABASE_URL=postgresql://hicleo:hicleo123@app-db:5432/hicleo
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        - NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY=${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY:-}
        - NEXT_PUBLIC_SECRETARY_PHONE=${NEXT_PUBLIC_SECRETARY_PHONE:-}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: hicleo-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  # --- Infraestrutura ---

  redis:
    image: redis:7-alpine
    container_name: hicleo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  app-db:
    image: postgres:16-alpine
    container_name: hicleo-app-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=hicleo
      - POSTGRES_PASSWORD=hicleo123
      - POSTGRES_DB=hicleo
    volumes:
      - app_db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hicleo"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: hicleo-evolution-api
    ports:
      - "8082:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-minha-chave-dev-local}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - LANGUAGE=pt-BR
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-evolution123}@evolution-db:5432/${EVOLUTION_DB_NAME:-evolution}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - QRCODE_LIMIT=30
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1039782722
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_LOCAL_ENABLED=false
      - WPP_LID_MODE=false
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  evolution-db:
    image: postgres:16
    container_name: hicleo-evolution-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${EVOLUTION_DB_USER:-evolution}
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:-evolution123}
      - POSTGRES_DB=${EVOLUTION_DB_NAME:-evolution}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: unless-stopped

  # --- Testes E2E ---
  # Roda com network_mode: host para acessar serviços locais (Ollama, DB, Backend)
  # sem necessidade de configuração extra. Ativado apenas via: docker compose --profile e2e run --rm e2e-quality

  e2e-quality:
    build:
      context: .
      dockerfile: tests/e2e-quality/Dockerfile
    network_mode: host
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://hicleo:hicleo123@localhost:5434/hicleo
      - BASE_URL=http://localhost:3001
      - E2E_OLLAMA_BASE_URL=http://localhost:11434
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - e2e

# --- Rede ---

networks:
  hicleo-network:
    driver: bridge

# --- Volumes ---

volumes:
  app_db_data:
  evolution_data:
  evolution_db_data:
