# ===========================================
# Hi Cleo — Docker Compose (Produção — VPS Limpa)
# ===========================================
# Sobe TODOS os serviços: nginx, backend, frontend, Redis, Evolution API, Postgres.
# Uso: docker compose -f docker-compose.prod.yml up -d --build
#
# Pré-requisitos:
# - .env configurado com valores de produção (senhas fortes!)
# - Certificados SSL em ./nginx/ssl/ (fullchain.pem + privkey.pem)
# - chmod 600 .env (restringir leitura)

services:
  # --- Reverse Proxy (único ponto de entrada) ---

  nginx:
    image: nginx:1.27-alpine
    container_name: hicleo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # / redireciona 301 para HTTPS; o healthcheck precisa seguir e aceitar o
      # certificado (self-signed em teste local, Cloudflare/LE em produção —
      # validar o cert aqui não agrega, o monitor externo já faz isso).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # --- Aplicação ---

  # --- Migrations (one-shot) ---
  # Roda a CADA `docker compose up` e sai; o backend só sobe se ela passar.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hicleo-migrate
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
      - MIGRATIONS_DIR=/app/migrations
      - SEEDS_DIR=/app/seeds
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - hicleo-network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hicleo-backend
    # Porta NÃO exposta ao host — só acessível via nginx na rede interna
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Crons (follow-up, cancelamento, prospecção) usam o fuso do processo:
      # sem TZ eles rodam em UTC e disparam 3h antes do horário planejado.
      - TZ=${TZ:-America/Sao_Paulo}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-db:5432/${DB_NAME}
    depends_on:
      migrate:
        condition: service_completed_successfully
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY=${NEXT_PUBLIC_MERCADO_PAGO_PUBLIC_KEY}
        - NEXT_PUBLIC_SECRETARY_PHONE=${NEXT_PUBLIC_SECRETARY_PHONE}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: hicleo-frontend
    # O server.js do Next.js standalone faz bind em $HOSTNAME, que o Docker
    # define como o ID do container. Sem isto o app só escuta no IP interno,
    # o healthcheck (localhost) falha e o nginx nunca inicia (depends_on healthy).
    environment:
      - HOSTNAME=0.0.0.0
    # Porta NÃO exposta ao host — só acessível via nginx na rede interna
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- Infraestrutura ---

  redis:
    image: redis:7-alpine
    container_name: hicleo-redis
    # Redis com senha obrigatória
    # Redis com senha obrigatória.
    # maxmemory-policy=noeviction é exigido pelo BullMQ: com allkeys-lru o Redis
    # pode despejar chaves da fila quando a memória encher, perdendo jobs
    # (mensagens de WhatsApp) silenciosamente. Com noeviction ele recusa a
    # escrita e loga erro — falha visível em vez de perda silenciosa.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 100mb --maxmemory-policy noeviction
    # Porta NÃO exposta ao host
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  app-db:
    image: postgres:16-alpine
    container_name: hicleo-app-db
    # Porta NÃO exposta ao host
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - app_db_data:/var/lib/postgresql/data
      # Migrations aplicadas pelo serviço `migrate` (uma única via, versionada)
      - db_backups:/backups
    healthcheck:
      # `-d` explícito pelo mesmo motivo do compose de dev: sem ele o pg_isready
      # assume banco = usuário e loga FATAL a cada 10s quando os nomes divergem.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hicleo} -d ${DB_NAME:-hicleo}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: hicleo-evolution-api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Porta NÃO exposta ao host
    expose:
      - "8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - LANGUAGE=pt-BR
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/${EVOLUTION_DB_NAME}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - QRCODE_LIMIT=30
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1039782722
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - TZ=${TZ:-America/Sao_Paulo}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - CACHE_LOCAL_ENABLED=false
      - WPP_LID_MODE=false
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  evolution-db:
    image: postgres:16
    container_name: hicleo-evolution-db
    # Porta NÃO exposta ao host
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${EVOLUTION_DB_USER}
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=${EVOLUTION_DB_NAME}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hicleo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

# --- Rede ---

networks:
  hicleo-network:
    driver: bridge

# --- Volumes ---

volumes:
  app_db_data:
  redis_data:
  evolution_data:
  evolution_db_data:
  db_backups:
  certbot_webroot:
